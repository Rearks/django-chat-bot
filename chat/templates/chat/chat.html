{% extends 'chat/base.html' %}

{% block title %}Чат - Общение с ботом{% endblock %}

{% block content %}
<h1>Чат с ботом</h1>

<div id="chat-messages" style="
    border: 1px solid #ddd;
    border-radius: 5px;
    height: 400px;
    overflow-y: auto;
    padding: 15px;
    background-color: white;
    margin-bottom: 20px;
">
    <p style="color: #999; text-align: center;">Начните общение с ботом</p>
</div>

<div style="display: flex; gap: 10px;">
    <input 
        type="text" 
        id="message-input" 
        placeholder="Напишите сообщение..."
        style="
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        "
    />
    <button 
        id="send-btn"
        onclick="sendMessage()"
        style="
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        "
    >
        Отправить
    </button>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById('message-input');
        const message = input.value.trim();

        if (!message) {
            alert('Напишите сообщение');
            return;
        }

        // Отправляем POST запрос
        fetch('/api/send-message/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ message: message })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert('Ошибка: ' + data.error);
            } else {
                displayMessage(data.user_message, data.bot_response);
                input.value = '';
            }
        })
        .catch(error => {
            console.error('Ошибка:', error);
            alert('Ошибка соединения');
        });
    }

    function displayMessage(userMsg, botMsg) {
        const chatDiv = document.getElementById('chat-messages');

        // Удаляем начальный текст если это первое сообщение
        if (chatDiv.innerHTML.includes('Начните общение')) {
            chatDiv.innerHTML = '';
        }

        // Добавляем сообщение пользователя
        const userMsgDiv = document.createElement('div');
        userMsgDiv.style.cssText = `
            margin-bottom: 15px;
            padding: 10px;
            background-color: #e3f2fd;
            border-radius: 5px;
            text-align: right;
        `;
        userMsgDiv.innerHTML = `<strong>Вы:</strong> ${userMsg}`;
        chatDiv.appendChild(userMsgDiv);

        // Добавляем ответ бота
        const botMsgDiv = document.createElement('div');
        botMsgDiv.style.cssText = `
            margin-bottom: 15px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
        `;
        botMsgDiv.innerHTML = `<strong>Бот:</strong> ${botMsg}`;
        chatDiv.appendChild(botMsgDiv);

        // Скроллим в конец
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Отправка по Enter
    document.getElementById('message-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>
{% endblock %}
