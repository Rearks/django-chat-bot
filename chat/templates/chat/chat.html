{% extends 'chat/base.html' %}
{% load static %}

{% block title %}Чат с ботом{% endblock %}

{% block content %}
<style>
    /*
    ФОН СТРАНИЦЫ
    */
    body {

        background-image: url('{% static "img5.png" %}');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;

        min-height: 100vh;
    }

    #send-btn {
        padding: 10px 20px;
        background-color: #333;
        color: white;
        border: 2px solid transparent;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    #send-btn:hover {
        border: 2px solid #667eea;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    #send-btn:active {
        background-color: #667eea;
        transform: translateY(0);
    }

    #send-btn.loading {
        background-color: #555;
        cursor: wait;
    }

    /*

    КАРТИНКА В ОКНЕ ЧАТА

    */
    .chat-header-image {
        width: 100%;
        max-width: 800px;
        height: 300px;
        object-fit: cover;
        border-radius: 10px;
        margin: 0 auto 20px auto;
        display: block;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
</style>

<h1 style="color: white; text-align: center;">Чат с ботом</h1>

<!-- Область сообщений -->
<div id="chat-messages" style="
    border: 1px solid #ddd;
    border-radius: 5px;
    height: 400px;
    overflow-y: auto;
    padding: 15px;
    background-color: transparent;
    margin-bottom: 20px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
">
    <!--

    КАРТИНКА В НАЧАЛЕ ЧАТА

    -->
    <img
        src="{% static 'img3.png' %}"
        alt="Чат-бот"
        class="chat-header-image"
    />

    <p style="color: #999; text-align: center;">Начните общение с ботом</p>
</div>

<!-- Поле ввода и кнопка -->
<div style="display: flex; gap: 10px;">
    <input
        type="text"
        id="message-input"
        placeholder="Напишите сообщение..."
        style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px;"
    />
    <button id="send-btn" onclick="sendMessage()">
        Отправить
    </button>
</div>

<script>
    // Отправка сообщения боту
    function sendMessage() {
        const input = document.getElementById('message-input');
        const btn = document.getElementById('send-btn');
        const message = input.value.trim();

        if (!message) {
            alert('Напишите сообщение');
            return;
        }

        // Блокируем кнопку и показываем загрузку
        btn.disabled = true;
        btn.classList.add('loading');
        const originalText = btn.textContent;

        // Анимация точек
        let dots = 0;
        const loadingInterval = setInterval(() => {
            dots = (dots + 1) % 4;
            btn.textContent = 'Отправка' + '.'.repeat(dots);
        }, 500);

        // POST запрос на сервер
        fetch('/api/send-message/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ message: message })
        })
        .then(response => response.json())
        .then(data => {
            // Останавливаем анимацию
            clearInterval(loadingInterval);
            btn.disabled = false;
            btn.classList.remove('loading');
            btn.textContent = originalText;

            if (data.error) {
                alert('Ошибка: ' + data.error);
            } else {
                // Показываем сообщения
                displayMessage(data.user_message, data.bot_response);
                input.value = '';
            }
        })
        .catch(error => {
            clearInterval(loadingInterval);
            btn.disabled = false;
            btn.classList.remove('loading');
            btn.textContent = originalText;
            alert('Ошибка соединения');
        });
    }

    // Показываем сообщение в чате
    function displayMessage(userMsg, botMsg) {
        const chatDiv = document.getElementById('chat-messages');

        // Удаляем приветствие и картинку при первом сообщении
        if (chatDiv.innerHTML.includes('Начните общение')) {
            chatDiv.innerHTML = '';
        }

        // Сообщение пользователя
        chatDiv.innerHTML += `
            <div style="margin-bottom: 15px; padding: 10px; background-color: #e3f2fd; border-radius: 5px; text-align: right; animation: slideIn 0.3s ease;">
                <strong>Вы:</strong> ${userMsg}
            </div>
        `;

        // Ответ бота
        chatDiv.innerHTML += `
            <div style="margin-bottom: 15px; padding: 10px; background-color: #f5f5f5; border-radius: 5px; animation: slideIn 0.3s ease;">
                <strong>Бот:</strong> ${botMsg}
            </div>
        `;

        // Прокручиваем вниз
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    // Получаем CSRF токен из cookies
    function getCookie(name) {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + '=')) {
                return decodeURIComponent(cookie.substring(name.length + 1));
            }
        }
        return null;
    }

    // Отправка по Enter
    document.getElementById('message-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>

<style>
    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}
