{% extends 'chat/base.html' %}

{% block title %}Чат с ботом{% endblock %}

{% block content %}
<h1>Чат с ботом</h1>

<!-- Область сообщений -->
<div id="chat-messages" style="
    border: 1px solid #ddd;
    border-radius: 5px;
    height: 400px;
    overflow-y: auto;
    padding: 15px;
    background-color: white;
    margin-bottom: 20px;
">
    <p style="color: #999; text-align: center;">Начните общение с ботом</p>
</div>

<!-- Поле ввода и кнопка -->
<div style="display: flex; gap: 10px;">
    <input
        type="text"
        id="message-input"
        placeholder="Напишите сообщение..."
        style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px;"
    />
    <button
        id="send-btn"
        onclick="sendMessage()"
        style="padding: 10px 20px; background-color: #333; color: white; border: none; border-radius: 5px; cursor: pointer;"
    >
        Отправить
    </button>
</div>

<script>
    // Отправка сообщения боту
    function sendMessage() {
        const input = document.getElementById('message-input');
        const message = input.value.trim();

        if (!message) {
            alert('Напишите сообщение');
            return;
        }

        // POST запрос на сервер
        fetch('/api/send-message/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ message: message })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert('Ошибка: ' + data.error);
            } else {
                // Показываем сообщения
                displayMessage(data.user_message, data.bot_response);
                input.value = '';
            }
        })
        .catch(error => {
            alert('Ошибка соединения');
        });
    }

    // Показываем сообщение в чате
    function displayMessage(userMsg, botMsg) {
        const chatDiv = document.getElementById('chat-messages');

        // Удаляем приветствие при первом сообщении
        if (chatDiv.innerHTML.includes('Начните общение')) {
            chatDiv.innerHTML = '';
        }

        // Сообщение пользователя
        chatDiv.innerHTML += `
            <div style="margin-bottom: 15px; padding: 10px; background-color: #e3f2fd; border-radius: 5px; text-align: right;">
                <strong>Вы:</strong> ${userMsg}
            </div>
        `;

        // Ответ бота
        chatDiv.innerHTML += `
            <div style="margin-bottom: 15px; padding: 10px; background-color: #f5f5f5; border-radius: 5px;">
                <strong>Бот:</strong> ${botMsg}
            </div>
        `;

        // Прокручиваем вниз
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    // Получаем CSRF токен из cookies
    function getCookie(name) {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + '=')) {
                return decodeURIComponent(cookie.substring(name.length + 1));
            }
        }
        return null;
    }

    // Отправка по Enter
    document.getElementById('message-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>
{% endblock %}
